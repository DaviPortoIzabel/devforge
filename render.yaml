services:
  - type: web
    name: devforge
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.0.0
      - key: DATA_DIR
        value: /var/data
    disks:
      - name: devforge-data
        mountPath: /var/data
        sizeGB: 1

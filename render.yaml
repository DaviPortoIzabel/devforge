services:
  - type: web
    name: devforge
    runtime: node
    plan: starter
    buildCommand: ""
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.0.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: devforge-data
      mountPath: /var/data
      sizeGB: 1
